[package]
authors = ["dada"]
build = "build.rs"
edition = "2024"
name = "awesome_info_display"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ab_glyph = "0.2.32"
audiotags = "0.5.0"
chrono = {version = "0.4.44", features = ["serde"]}
chrono-tz = "0.10.4"
cpu-monitor = "0.1.1"
crc32fast = "1.5.0"
crossbeam-channel = "0.5.15"
debounce = "0.2.2"
exchange_format = {git = "https://github.com/daniel-prause/exchange-format"}
glob = "0.3.3"
iced = {version = "0.14.0", features = ["canvas", "tokio", "image"]}
id3 = "1.16.4"
image = {version = "0.25.10", default-features = false, features = ["ico"]}
imageproc = "0.26.2"
indexmap = {version = "2.14.0", features = ["serde"]}
lazy_static = "1.5.0"
libloading = "0.9.0"
named-lock = "0.4.1"
once_cell = "1.21.4"
open-meteo-rs = "0.1.0"
rdev = {version = "0.5.3", features = ["unstable_grab"]}
regex = "1.12.3"
reqwest = {version = "0.13.3", features = ["blocking", "json"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
serialport = {git = "https://github.com/serialport/serialport-rs"}
signal-hook = "0.4.4"
systemstat = "0.2.6"
tokio = "1.52.1"
unicode-segmentation = "1.13.2"
webp = "0.3.1"
winsafe = {git = "https://github.com/rodrigocfd/winsafe", features = ['user', 'ole', 'kernel']}
[target.'cfg(windows)'.dependencies]
winapi = {version = "0.3.9", features = ["winuser", "mmdeviceapi", "combaseapi", "objbase", "endpointvolume", "memoryapi"]}
[build-dependencies]
static_vcruntime = "3.0.0"
winres = "0.1.12"
